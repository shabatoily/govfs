name: govfs CI/CD Pipeline

on:
  push:
    branches:
      - 'develop'
      - 'release/**'
      - 'v[0-9].*'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'develop'
      - 'release/**'

jobs:
  # [1] 검증 단계: 모든 브랜치 및 PR에서 공통 수행
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: 'webui/yarn.lock'

      - name: Install dependencies
        run: make install

      - name: Create webui/dist (bypass go:embed error)
        run: mkdir -p webui/dist && touch webui/dist/index.html

      - name: Run Tests
        run: make test

  # [2] 빌드 단계: develop 브랜치가 아닐 때만 수행
  build:
    name: Build Artifact
    needs: test
    if: github.ref_name != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: 'webui/yarn.lock'

      - name: Install dependencies
        run: make install

      - name: Build Release
        run: make release tag=${{github.ref_name}}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          retention-days: 5

  # [3] 릴리즈 단계: 실제 버전 태그(v1.0.0 등)가 푸시될 때만 수행
  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ./release-download

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-download/**/*
          generate_release_notes: true