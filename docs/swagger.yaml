components:
  schemas:
    badger.Stats:
      properties:
        count:
          type: integer
        size:
          type: integer
      type: object
    payload:
      properties:
        payload:
          $ref: '#/components/schemas/types.TreeNodeRes'
      type: object
    time.Duration:
      description: 재연결 시도 주기
      enum:
      - -9223372036854775808
      - 9223372036854775807
      - 1
      - 1000
      - 1000000
      - 1000000000
      - 60000000000
      - 3600000000000
      type: integer
      x-enum-varnames:
      - minDuration
      - maxDuration
      - Nanosecond
      - Microsecond
      - Millisecond
      - Second
      - Minute
      - Hour
    types.BadgerKeyRes:
      properties:
        keys:
          description: 매칭된 키 목록
          items:
            type: string
          type: array
          uniqueItems: false
        prefix:
          description: 조회 시 사용한 접두사
          type: string
      type: object
    types.BadgerResourceRes:
      properties:
        blockCacheMaxCost:
          type: integer
        indexCacheMaxCost:
          type: integer
        lsmSize:
          type: integer
        userId:
          type: string
        vlogSize:
          type: integer
      type: object
    types.BadgerStatRes:
      properties:
        prefixBy:
          additionalProperties:
            $ref: '#/components/schemas/badger.Stats'
          description: 접두사별 통계
          type: object
        totalCount:
          description: 개수
          type: integer
        totalSize:
          description: 크기
          type: integer
      type: object
    types.ChangePasswordReq:
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      type: object
    types.ClientInfo:
      properties:
        addr:
          type: string
        createdAt:
          type: string
        id:
          type: string
        user:
          type: string
      type: object
    types.ClientList:
      properties:
        clients:
          items:
            $ref: '#/components/schemas/types.ClientInfo'
          type: array
          uniqueItems: false
      type: object
    types.CreateUserReq:
      properties:
        password:
          type: string
        role:
          $ref: '#/components/schemas/types.Role'
        username:
          type: string
      type: object
    types.DstReq:
      properties:
        name:
          type: string
      type: object
    types.LoginReq:
      properties:
        password:
          type: string
        username:
          type: string
      type: object
    types.MetaRes:
      description: 노드 메타데이터
      properties:
        comments:
          type: string
        extension:
          type: string
        id:
          type: string
        isDir:
          type: boolean
        modified:
          type: string
        name:
          type: string
        path:
          type: string
        size:
          type: integer
        url:
          description: 파일 다운로드 또는 접근 URL
          type: string
      type: object
    types.Role:
      enum:
      - admin
      - user
      type: string
      x-enum-varnames:
      - RoleAdmin
      - RoleUser
    types.RotateKeyReq:
      properties:
        key:
          type: string
      type: object
    types.SSEData:
      description: 데이터 페이로드
      properties:
        message:
          description: 메시지 내용
          type: string
        meta:
          $ref: '#/components/schemas/types.SSEMeta'
        status:
          description: 성공 여부
          type: boolean
        timestamp:
          description: 이벤트 발생 시간
          type: string
      type: object
    types.SSEEvent:
      description: 이벤트 유형
      enum:
      - heartbeat
      - subscribe
      - unsubscribe
      - publish
      - error
      type: string
      x-enum-varnames:
      - SSEEventHeartbeat
      - SSEEventSubscribe
      - SSEEventUnsubscribe
      - SSEEventPublish
      - SSEEventError
    types.SSEMessage:
      properties:
        data:
          $ref: '#/components/schemas/types.SSEData'
        event:
          $ref: '#/components/schemas/types.SSEEvent'
        id:
          description: 메시지 고유 ID
          type: string
        retry:
          $ref: '#/components/schemas/time.Duration'
      type: object
    types.SSEMeta:
      description: 메타데이터
      properties:
        action:
          description: 수행된 액션
          type: string
        id:
          description: 관련 리소스 ID
          type: string
        path:
          description: 관련 리소스 경로
          type: string
      type: object
    types.StatusRes:
      properties:
        badgerDrives:
          items:
            $ref: '#/components/schemas/types.BadgerResourceRes'
          type: array
          uniqueItems: false
        openDrives:
          type: integer
        system:
          $ref: '#/components/schemas/types.StorageStatRes'
        users:
          type: integer
      type: object
    types.StorageStatRes:
      properties:
        items:
          type: integer
        size:
          type: integer
      type: object
    types.SystemEntryPageRes:
      properties:
        items:
          items:
            $ref: '#/components/schemas/types.SystemEntryRes'
          type: array
          uniqueItems: false
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      type: object
    types.SystemEntryRes:
      properties:
        key:
          type: string
        kind:
          type: string
        value: {}
      type: object
    types.TokenRes:
      properties:
        expiresAt:
          type: string
        id:
          type: string
        role:
          $ref: '#/components/schemas/types.Role'
        token:
          type: string
        username:
          type: string
      type: object
    types.TreeNodeRes:
      properties:
        children:
          description: 하위 자식 노드 목록
          items:
            $ref: '#/components/schemas/types.TreeNodeRes'
          type: array
          uniqueItems: false
        meta:
          $ref: '#/components/schemas/types.MetaRes'
      type: object
    types.UpdateUserReq:
      properties:
        disabled:
          type: boolean
        password:
          type: string
        role:
          $ref: '#/components/schemas/types.Role'
      type: object
    types.UserDriveStatusRes:
      properties:
        items:
          type: integer
        online:
          type: boolean
        open:
          type: boolean
        size:
          type: integer
        sseCount:
          type: integer
        userId:
          type: string
        username:
          type: string
      type: object
    types.UserEventPageRes:
      properties:
        items:
          items:
            $ref: '#/components/schemas/types.UserEventRes'
          type: array
          uniqueItems: false
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      type: object
    types.UserEventRes:
      properties:
        action:
          type: string
        createdAt:
          type: string
        id:
          type: string
        status:
          type: integer
        userId:
          type: string
        username:
          type: string
      type: object
    types.UserRes:
      properties:
        createdAt:
          type: string
        disabled:
          type: boolean
        id:
          type: string
        role:
          $ref: '#/components/schemas/types.Role'
        updatedAt:
          type: string
        username:
          type: string
      type: object
    types.VfsRes:
      allOf:
      - $ref: '#/components/schemas/payload'
      properties:
        path:
          description: 요청된 경로
          type: string
        payload:
          description: 실제 데이터 페이로드
          type: object
        viewType:
          description: 조회 방식
          enum:
          - list
          - tree
          type: string
      type: object
    types.WriteCommentReq:
      properties:
        comment:
          type: string
      type: object
    types.WriteReq:
      properties:
        content:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Bearer 토큰을 "Bearer {token}" 형식으로 입력합니다.
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: miniyu97@gmail.com
    name: meteormin
  description: govfs is a virtual file system server
  title: govfs
  version: 1.0.0
openapi: 3.1.0
paths:
  /admin/events:
    get:
      parameters:
      - description: user id
        in: query
        name: userId
        schema:
          type: string
      - description: page
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: page size
        in: query
        name: pageSize
        schema:
          default: 20
          maximum: 100
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.UserEventPageRes'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 사용자 이벤트
      tags:
      - admin
  /admin/status:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.StatusRes'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 사용자 시스템 상태
      tags:
      - admin
  /admin/system/entries:
    get:
      parameters:
      - description: page
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: page size
        in: query
        name: pageSize
        schema:
          default: 20
          maximum: 100
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.SystemEntryPageRes'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 시스템 DB 상세
      tags:
      - admin
  /admin/users:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/types.UserRes'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 사용자 목록
      tags:
      - admin
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.CreateUserReq'
              description: user
              summary: request
        description: user
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.UserRes'
          description: Created
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 사용자 생성
      tags:
      - admin
  /admin/users/{id}:
    patch:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.UpdateUserReq'
              description: changes
              summary: request
        description: changes
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.UserRes'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                type: string
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 사용자 수정
      tags:
      - admin
  /admin/users/{id}/events:
    delete:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                type: string
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 사용자 이벤트 전체 삭제
      tags:
      - admin
  /admin/users/{id}/status:
    get:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.UserDriveStatusRes'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                type: string
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 사용자 드라이브 상태
      tags:
      - admin
  /auth/login:
    post:
      description: 사용자 자격 증명을 확인하고 JWT 토큰을 발급합니다.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/types.LoginReq'
                description: login request
                summary: request
        description: login request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.TokenRes'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: 로그인
      tags:
      - auth
  /auth/logout:
    post:
      description: 클라이언트의 JWT 토큰 쿠키를 삭제하여 로그아웃 처리합니다.
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 로그아웃
      tags:
      - auth
  /auth/me:
    get:
      description: 현재 토큰의 유효성을 검증하고 사용자 정보를 반환합니다.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.TokenRes'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 로그인 상태 확인
      tags:
      - auth
  /auth/password:
    patch:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.ChangePasswordReq'
              description: passwords
              summary: request
        description: passwords
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 비밀번호 변경
      tags:
      - auth
  /badger/keys:
    get:
      description: 데이터베이스 내의 모든 키를 조회합니다.
      parameters:
      - description: prefix
        in: query
        name: prefix
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.BadgerKeyRes'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 키 목록 조회
      tags:
      - badger
  /badger/rotate:
    post:
      description: 데이터베이스의 암호화 키를 교체(Rotate)합니다.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/types.RotateKeyReq'
                description: new key
                summary: key
        description: new key
        required: true
      responses:
        "202":
          content:
            text/plain:
              schema:
                type: string
          description: Accepted
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Bad Request
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: 암호화 키 교체
      tags:
      - badger
  /badger/stats:
    get:
      description: DB 내의 메타, 블롭, 인덱스 별 통계를 조회합니다.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.BadgerStatRes'
          description: OK
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: DB 통계 조회
      tags:
      - badger
  /sse/clients:
    get:
      description: 연결된 모든 SSE 클라이언트의 정보를 반환합니다.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.ClientList'
          description: OK
      security:
      - BearerAuth: []
      summary: SSE 클라이언트 목록 조회
      tags:
      - SSE
  /sse/publish/{id}:
    post:
      description: 지정된 클라이언트(또는 전체)에 Server-Sent Event 메시지를 발행합니다.
      parameters:
      - description: client id
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/types.SSEMeta'
                description: meta data
                summary: metaData
        description: meta data
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
      security:
      - BearerAuth: []
      summary: SSE 메시지 발행
      tags:
      - SSE
  /sse/subscribe:
    get:
      description: Server-Sent Events 스트림에 클라이언트를 구독시킵니다.
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/types.SSEMessage'
          description: OK
        "503":
          content:
            text/event-stream:
              schema:
                type: string
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: SSE 구독
      tags:
      - SSE
  /vfs:
    get:
      description: 지정된 경로의 하위 파일 및 디렉터리 목록을 가져옵니다.
      parameters:
      - description: path
        in: query
        name: q
        schema:
          default: /
          type: string
      - description: view type
        in: query
        name: viewType
        schema:
          enum:
          - list
          - tree
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/payload'
                  properties:
                    path:
                      description: 요청된 경로
                      type: string
                    payload:
                      description: 실제 데이터 페이로드
                      type: object
                    viewType:
                      description: 조회 방식
                      enum:
                      - list
                      - tree
                      type: string
                  type: object
                - allOf:
