      - vfs
  /vfs/backup:
    post:
      description: backup all file
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: file
          description: OK
        "500":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/fiber.Error'
          description: Internal Server Error
      summary: Backup all file
      tags:
      - vfs
  /vfs/badger/keys:
    get:
      description: all keys
      parameters:
      - description: prefix
        in: query
        name: prefix
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.BadgerKeyRes'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Error'
          description: Internal Server Error
      summary: AllKeys
      tags:
      - vfs
  /vfs/restore:
    post:
      description: restore all file
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              title: file
              type: file
          multipart/form-data:
            schema:
              type: object
        description: file
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Error'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Error'
          description: Internal Server Error
      summary: Restore all file
      tags:
      - vfs
  /vfs/rotate:
    post:
      description: rotate encryption key
      requestBody:
        content:
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              title: key
              type: string
        description: new key
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                type: string
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Error'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Error'
          description: Internal Server Error
      summary: Rotate encryption key
      tags:
      - vfs
servers:
- description: Localhost
  url: http://localhost:3000
