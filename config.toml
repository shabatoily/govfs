[server]
# fiber server port
port = 3000

[server.logger]
path = "./logs/server.log"
accessLogPath = "./logs/access-log.log"
# log-level: debug=-4, info=0, warn=4, error=8
level = 0

[server.auth]
enabled = false
username = "${SERVER_AUTH_USERNAME}"
password = "${SERVER_AUTH_PASSWORD}"
[server.auth.jwt]
secret = "${SERVER_AUTH_JWT_SECRET}"
exp = "24h"

[server.middlewares]
config = true
envvar = true
expvar = true
pprof = true
route = true
swagger = true

[server.webui]
enabled = true

[vfs.driver]
type = "badger"

[vfs.driver.badger]
path = "./data"
encryptKeyRotateDuration = "24h"
gcInterval = "5m"
gcDiscardRatio = 0.7

[vfs.logger]
path = "./logs/vfs.log"
# log-level: trace=-1, debug=0, info=1, warn=2, error=3, fatal=4, panic=5, noLevel=6, disabled=7
level = -1

[cloud.googleDrive]
tokenPath = ".googledrive"
clientID = "${CLOUD_GOOGLEDRIVE_CLIENT_ID}"
clientSecret = "${CLOUD_GOOGLEDRIVE_CLIENT_SECRET}"
parentFolderID = "govfs"
